<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Selah — Read & Listen to the Bible</title>

  <meta
    name="description"
    content="Read the Bible and listen along with narrated audio, verse by verse."
  >

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

  <link
    href="https://api.fontshare.com/v2/css?f[]=zodiak@400,500&f[]=satoshi@400,500,700&display=swap"
    rel="stylesheet"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap"
    rel="stylesheet"
  >
</head>

<body>
  <a class="skip" href="#reader">Skip to reading</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#" aria-label="Selah home">
        <svg
          class="brand__mark"
          viewBox="0 0 40 40"
          fill="none"
          aria-hidden="true"
        >
          <rect
            x="2"
            y="2"
            width="36"
            height="36"
            rx="11"
            fill="currentColor"
            opacity=".12"
          />

          <path
            d="M20 10.5c-4-2.5-8.7-3.1-13-2.4v22.1c4.3-.7 9 0 13 2.5 4-2.5 8.7-3.2 13-2.5V8.1c-4.3-.7-9 0-13 2.4Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          />

          <path
            d="M20 10.5v22.2"
            stroke="currentColor"
            stroke-width="2"
          />

          <path
            d="M12 16v5M15.2 13.9v9.2M24.8 13.9v9.2M28 16v5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>

        <span class="brand__name">Selah</span>
      </a>

      <button
        class="refbtn"
        id="refBtn"
        type="button"
        aria-haspopup="dialog"
        aria-controls="picker"
      >
        <span id="refLabel">John 3</span>
        <span aria-hidden="true">⌄</span>
      </button>

      <div class="topbar__actions">
        <button
          class="iconbtn"
          id="searchBtn"
          type="button"
          aria-label="Search the Bible"
        >
          <span aria-hidden="true">⌕</span>
        </button>

        <button
          class="iconbtn"
          id="bookmarksBtn"
          type="button"
          aria-label="Your bookmarks"
        >
          <span aria-hidden="true">🔖</span>
          <span class="badge" id="bmBadge" hidden>0</span>
        </button>

        <label class="sr-only" for="translationSel">
          Translation
        </label>

        <select
          id="translationSel"
          class="select"
          title="Translation"
        ></select>

        <button
          class="iconbtn"
          id="settingsBtn"
          type="button"
          aria-label="Reading settings"
          aria-expanded="false"
        >
          <span aria-hidden="true">Aa</span>
        </button>
      </div>
    </div>
    <div
      class="settings"
      id="settingsPanel"
      hidden
    >
      <div class="settings__row">
        <span>Text size</span>

        <div class="seg">
          <button
            id="fontDown"
            type="button"
            aria-label="Smaller text"
          >
            A−
          </button>

          <button
            id="fontUp"
            type="button"
            aria-label="Larger text"
          >
            A+
          </button>
        </div>
      </div>

      <div class="settings__row">
        <span>Theme</span>

        <button
          class="themeswitch"
          id="themeBtn"
          type="button"
        >
          <span id="themeLabel">Dark</span>
        </button>
      </div>

      <label class="settings__row">
        <span>Follow along while listening</span>
        <input
          type="checkbox"
          id="followToggle"
          checked
        >
      </label>

      <label class="settings__row">
        <span>Auto-play next chapter</span>
        <input
          type="checkbox"
          id="autoNextToggle"
          checked
        >
      </label>

      <label class="settings__row">
        <span>Show verse numbers</span>
        <input
          type="checkbox"
          id="numsToggle"
          checked
        >
      </label>
    </div>
  </header>

  <main
    id="reader"
    class="reader"
    tabindex="-1"
  >
    <div class="reader__head">
      <p
        class="eyebrow"
        id="bookTitle"
      >
        The Gospel According to John
      </p>

      <h1 class="chapter-title">
        <span id="chapterBook">John</span>
        <span
          id="chapterNum"
          class="chapter-title__num"
        >
          3
        </span>
      </h1>

      <p
        class="translation-note"
        id="translationNote"
      ></p>
    </div>

    <article
      class="scripture"
      id="scripture"
      aria-live="polite"
    >
      <p>Loading Scripture…</p>
    </article>

    <nav
      class="chapnav"
      aria-label="Chapter navigation"
    >
      <button
        class="chapnav__btn"
        id="prevChap"
        type="button"
      >
        ←
        <span id="prevLabel">Previous</span>
      </button>

      <button
        class="chapnav__btn"
        id="nextChap"
        type="button"
      >
        <span id="nextLabel">Next</span>
        →
      </button>
    </nav>

    <p class="credits">
      Text and audio from the
      <a
        href="https://bible.helloao.org"
        target="_blank"
        rel="noopener noreferrer"
      >
        Free Use Bible API
      </a>.
    </p>
  </main>

  <div
    class="popover"
    id="versePop"
    role="menu"
    hidden
  >
    <button
      role="menuitem"
      id="popPlay"
      type="button"
    >
      ▶ Listen from here
    </button>

    <button
      role="menuitem"
      id="popBookmark"
      type="button"
    >
      🔖
      <span id="popBookmarkLabel">Bookmark</span>
    </button>

    <button
      role="menuitem"
      id="popCopy"
      type="button"
    >
      ▣ Copy verse
    </button>
  </div>

  <section
    class="player"
    aria-label="Audio player"
  >
    <div class="player__progress">
      <input
        type="range"
        id="seek"
        min="0"
        max="1000"
        value="0"
        step="1"
        aria-label="Seek"
      >

      <div class="player__times">
        <span id="tCur">0:00</span>

        <span
          id="tNow"
          class="player__now"
        ></span>

        <span id="tDur">0:00</span>
      </div>
    </div>

    <div class="player__row">
      <div class="player__left">
        <label
          class="sr-only"
          for="narratorSel"
        >
          Narrator
        </label>

        <div class="narrator">
          <span aria-hidden="true">🎙</span>

          <select
            id="narratorSel"
            class="select select--bare"
            title="Narrator"
          ></select>
        </div>
      </div>

      <div class="player__controls">
        <button
          class="iconbtn"
          id="prevVerse"
          type="button"
          aria-label="Previous verse"
        >
          ◀
        </button>

        <button
          class="playbtn"
          id="playBtn"
          type="button"
          aria-label="Play"
        >
          <span class="i-play">▶</span>
          <span class="i-pause">Ⅱ</span>
          <span class="spinner"></span>
        </button>

        <button
          class="iconbtn"
          id="nextVerse"
          type="button"
          aria-label="Next verse"
        >
          ▶
        </button>
      </div>

      <div class="player__right">
        <button
          class="speed"
          id="speedBtn"
          type="button"
        >
          1×
        </button>
      </div>
    </div>
  </section>

  <div
    class="picker"
    id="picker"
    role="dialog"
    aria-modal="true"
    aria-labelledby="pickerTitle"
    hidden
  >
    <div
      class="picker__backdrop"
      data-close
    ></div>

    <div class="picker__sheet">
      <div class="picker__head">
        <button
          class="iconbtn picker__back"
          id="pickerBack"
          type="button"
          hidden
          aria-label="Back to books"
        >
          ←
        </button>

        <h2 id="pickerTitle">Choose a book</h2>

        <button
          class="iconbtn"
          type="button"
          data-close
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <form
        class="jump"
        id="jumpForm"
        autocomplete="off"
      >
        <input
          id="jumpInput"
          type="text"
          placeholder="Filter books or enter Psalm 23 or John 3:16"
          aria-label="Filter books or jump to a reference"
        >
      </form>

      <div
        class="picker__body"
        id="pickerBody"
      ></div>
    </div>
  </div>

  <div
    class="picker"
    id="searchDlg"
    role="dialog"
    aria-modal="true"
    aria-labelledby="searchTitle"
    hidden
  >
    <div
      class="picker__backdrop"
      data-close
    ></div>

    <div class="picker__sheet">
      <div class="picker__head">
        <span></span>

        <h2 id="searchTitle">Search</h2>

        <button
          class="iconbtn"
          type="button"
          data-close
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <form
        class="jump"
        id="searchForm"
        autocomplete="off"
        role="search"
      >
        <input
          id="searchInput"
          type="search"
          placeholder='Search words or "an exact phrase"'
          aria-label="Search words or phrases"
        >
      </form>
      <div class="searchbar">
        <div
          class="seg seg--scope"
          role="radiogroup"
          aria-label="Search scope"
        >
          <button
            type="button"
            data-scope="all"
            aria-checked="true"
          >
            Whole Bible
          </button>

          <button
            type="button"
            data-scope="ot"
            aria-checked="false"
          >
            Old Testament
          </button>

          <button
            type="button"
            data-scope="nt"
            aria-checked="false"
          >
            New Testament
          </button>
        </div>
      </div>

      <div
        class="picker__body"
        id="searchBody"
      >
        <p>Type a word or phrase to search.</p>
      </div>
    </div>
  </div>

  <div
    class="picker"
    id="bookmarksDlg"
    role="dialog"
    aria-modal="true"
    aria-labelledby="bookmarksTitle"
    hidden
  >
    <div
      class="picker__backdrop"
      data-close
    ></div>

    <div class="picker__sheet picker__sheet--narrow">
      <div class="picker__head">
        <span></span>

        <h2 id="bookmarksTitle">Bookmarks</h2>

        <button
          class="iconbtn"
          type="button"
          data-close
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <div
        class="picker__body"
        id="bmBody"
      >
        <p>No bookmarks yet.</p>
      </div>
    </div>
  </div>

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

  <audio
    id="audio"
    preload="none"
  ></audio>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
