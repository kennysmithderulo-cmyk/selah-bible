<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Selah — Read & Listen to the Bible</title>

  <meta
    name="description"
    content="Read the Bible and listen along with narrated audio, verse by verse."
  >

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://api.fontshare.com/v2/css?f[]=zodiak@400,500&f[]=satoshi@400,500,700&display=swap"
    rel="stylesheet"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap"
    rel="stylesheet"
  >
</head>

<body>
  <a class="skip" href="#reader">Skip to reading</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#" id="brandLink" aria-label="Selah home">
        <svg class="brand__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path
            d="M16 8.5C12.5 6.2 8.2 5.6 4 6.2v18c4.2-.6 8.5 0 12 2.3 3.5-2.3 7.8-2.9 12-2.3v-18c-4.2-.6-8.5 0-12 2.3Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path d="M16 8.5v18" stroke="currentColor" stroke-width="1.8"/>
          <path
            d="M8.5 13.5v4M11.5 11.8v7.4M20.5 11.8v7.4M23.5 13.5v4"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>

        <span class="brand__name">Selah</span>
      </a>

      <button
        class="refbtn"
        id="refBtn"
        type="button"
        aria-haspopup="dialog"
        aria-controls="picker"
      >
        <span id="refLabel">John 3</span>

        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
          <path
            d="m5 7.5 5 5 5-5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <div class="topbar__actions">
        <button
          class="iconbtn"
          id="searchBtn"
          type="button"
          aria-label="Search the Bible"
          aria-haspopup="dialog"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle
              cx="10.5"
              cy="10.5"
              r="6.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="m15.5 15.5 5 5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </button>

        <button
          class="iconbtn"
          id="bookmarksBtn"
          type="button"
          aria-label="Your bookmarks"
          aria-haspopup="dialog"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              d="M6.5 4h11v16.5L12 16.5 6.5 20.5V4Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>

          <span class="badge" id="bmBadge" hidden>0</span>
        </button>

        <label class="sr-only" for="translationSel">Translation</label>
        <select id="translationSel" class="select" title="Translation"></select>

        <button
          class="iconbtn"
          id="settingsBtn"
          type="button"
          aria-label="Reading settings"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <text x="3" y="17" font-size="13" font-family="Georgia,serif" fill="currentColor">A</text>
            <text x="12" y="17" font-size="9" font-family="Georgia,serif" fill="currentColor">A</text>
          </svg>
        </button>
      </div>
    </div>

    <div class="settings" id="settingsPanel" hidden>
      <div class="settings__row">
        <span>Text size</span>
        <div class="seg">
          <button id="fontDown" type="button" aria-label="Smaller text">A−</button>
          <button id="fontUp" type="button" aria-label="Larger text">A+</button>
        </div>
      </div>

      <div class="settings__row">
        <span>Theme</span>
        <button class="themeswitch" id="themeBtn" type="button" aria-label="Toggle dark mode">
          <span aria-hidden="true">◐</span>
          <span id="themeLabel">Dark</span>
        </button>
      </div>

      <label class="settings__row">
        <span>Follow along while listening</span>
        <input type="checkbox" id="followToggle" checked>
      </label>

      <label class="settings__row">
        <span>Auto-play next chapter</span>
        <input type="checkbox" id="autoNextToggle" checked>
      </label>

      <label class="settings__row">
        <span>Show verse numbers</span>
        <input type="checkbox" id="numsToggle" checked>
      </label>
    </div>
  </header>

  <main id="reader" class="reader" tabindex="-1">
    <div class="reader__head">
      <p class="eyebrow" id="bookTitle">The Gospel According to John</p>

      <h1 class="chapter-title">
        <span id="chapterBook">John</span>
        <span id="chapterNum" class="chapter-title__num">3</span>
      </h1>

      <p class="translation-note" id="translationNote"></p>
    </div>

    <article class="scripture" id="scripture" aria-live="polite">
      <p>Loading Scripture…</p>
    </article>

    <nav class="chapnav" aria-label="Chapter navigation">
      <button class="chapnav__btn" id="prevChap" type="button">
        <span aria-hidden="true">←</span>
        <span id="prevLabel">Previous</span>
      </button>

      <button class="chapnav__btn" id="nextChap" type="button">
        <span id="nextLabel">Next</span>
        <span aria-hidden="true">→</span>
      </button>
    </nav>

    <p class="credits">
      Text and audio from the
      <a href="https://bible.helloao.org" target="_blank" rel="noopener noreferrer">
        Free Use Bible API
      </a>.
    </p>
  </main>

  <div class="popover" id="versePop" role="menu" hidden>
    <button role="menuitem" id="popPlay" type="button">▶ Listen from here</button>
    <button role="menuitem" id="popBookmark" type="button">
      🔖 <span id="popBookmarkLabel">Bookmark</span>
    </button>
    <button role="menuitem" id="popCopy" type="button">▣ Copy verse</button>
  </div>

  <section class="player" aria-label="Audio player">
    <div class="player__progress">
      <input
        type="range"
        id="seek"
        min="0"
        max="1000"
        value="0"
        step="1"
        aria-label="Seek"
      >

      <div class="player__times">
        <span id="tCur">0:00</span>
        <span id="tNow" class="player__now"></span>
        <span id="tDur">0:00</span>
      </div>
    </div>

    <div class="player__row">
      <div class="player__left">
        <label class="sr-only" for="narratorSel">Narrator</label>

        <div class="narrator">
          <span aria-hidden="true">🎙</span>
          <select id="narratorSel" class="select select--bare" title="Narrator"></select>
        </div>
      </div>

      <div class="player__controls">
        <button class="iconbtn" id="prevVerse" type="button" aria-label="Previous verse">◀</button>

        <button class="playbtn" id="playBtn" type="button" aria-label="Play">
          <span class="i-play">▶</span>
          <span class="i-pause">Ⅱ</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <button class="iconbtn" id="nextVerse" type="button" aria-label="Next verse">▶</button>
      </div>

      <div class="player__right">
        <button class="speed" id="speedBtn" type="button" aria-label="Playback speed">1×</button>
      </div>
    </div>
  </section>

  <div
    class="picker"
    id="picker"
    role="dialog"
    aria-modal="true"
    aria-labelledby="pickerTitle"
    hidden
  >
    <div class="picker__backdrop" data-close></div>

    <div class="picker__sheet">
      <div class="picker__head">
        <button
          class="iconbtn picker__back"
          id="pickerBack"
          type="button"
          aria-label="Back to books"
          hidden
        >
          ←
        </button>

        <h2 id="pickerTitle">Choose a book</h2>

        <button class="iconbtn" type="button" data-close aria-label="Close">×</button>
      </div>

      <form class="jump" id="jumpForm" autocomplete="off">
        <input
          id="jumpInput"
          type="text"
          placeholder="Filter books or go to a verse — e.g. Psalm 23 or Rom 8:28"
          aria-label="Filter books or jump to reference"
        >
      </form>

      <div class="picker__body" id="pickerBody"></div>
    </div>
  </div>

  <div
    class="picker"
    id="searchDlg"
    role="dialog"
    aria-modal="true"
    aria-labelledby="searchTitle"
    hidden
  >
    <div class="picker__backdrop" data-close></div>

    <div class="picker__sheet">
      <div class="picker__head">
        <span></span>
        <h2 id="searchTitle">Search</h2>
        <button class="iconbtn" type="button" data-close aria-label="Close">×</button>
      </div>

      <form class="jump" id="searchForm" autocomplete="off" role="search">
        <input
          id="searchInput"
          type="search"
          placeholder='Search words or "an exact phrase"'
          aria-label="Search words or phrases"
        >
      </form>

      <div class="searchbar">
        <div class="seg seg--scope" role="radiogroup" aria-label="Search scope">
          <button type="button" role="radio" data-scope="all" aria-checked="true">Whole Bible</button>
          <button type="button" role="radio" data-scope="ot" aria-checked="false">Old Testament</button>
          <button type="button" role="radio" data-scope="nt" aria-checked="false">New Testament</button>
        </div>

        <span class="searchbar__tr" id="searchTr"></span>
      </div>

      <div class="chips" id="searchBooks"></div>

      <div class="picker__body" id="searchBody">
        <p>Type a word or phrase to search.</p>
      </div>
    </div>
  </div>

  <div
    class="picker"
    id="bookmarksDlg"
    role="dialog"
    aria-modal="true"
    aria-labelledby="bmTitle"
    hidden
  >
    <div class="picker__backdrop" data-close></div>

    <div class="picker__sheet picker__sheet--narrow">
      <div class="picker__head">
        <span></span>
        <h2 id="bmTitle">Bookmarks</h2>
        <button class="iconbtn" type="button" data-close aria-label="Close">×</button>
      </div>

      <div class="picker__body" id="bmBody">
        <p>No bookmarks yet.</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <audio id="audio" preload="none"></audio>

  <!-- This must load before app.js. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
